{% extends "base.html" %}
{% block title %}Create Account — Smile Care Dental{% endblock %}
{% block content %}
<section class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="text-xs font-semibold text-brand-600 uppercase tracking-widest mb-2">New patient</div>
      <h1 class="font-display text-4xl font-bold text-ink-900">Create your account</h1>
      <p class="text-gray-500 mt-2 text-sm">Takes 30 seconds. Book your first visit right after.</p>
    </div>
    <div class="card p-8 shadow-lg">
      {% if error %}
        <div class="mb-5 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm flex items-start gap-2">
          <span class="mt-0.5">⚠️</span><span>{{ error }}</span>
        </div>
      {% endif %}
      <form method="post" action="/api/register" class="space-y-5">
        <div>
          <label>Full name</label>
          <input type="text" name="name" required placeholder="Your full name" autocomplete="name"/>
        </div>
        <div>
          <label>Email address</label>
          <input type="email" name="email" required placeholder="you@example.com" autocomplete="email"/>
        </div>
        <div>
          <label>Phone number <span class="text-gray-400 font-normal">(optional)</span></label>
          <input type="tel" name="phone" placeholder="+91 98765 43210" autocomplete="tel"/>
        </div>
        <div>
          <label>Password</label>
          <div class="password-field">
            <input id="register-password" type="password" name="password" required minlength="6" placeholder="Min. 6 characters" autocomplete="new-password"/>
            <button type="button" class="password-toggle" data-password-toggle aria-controls="register-password" aria-label="Show password" aria-pressed="false">Show password</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full py-3">Create account →</button>
      </form>
      <div class="mt-6 pt-5 border-t text-center text-sm text-gray-500">
        Already have an account? <a href="/api/login" class="text-brand-600 font-semibold hover:text-brand-700">Log in</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
