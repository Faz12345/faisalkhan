{% extends "base.html" %}
{% block content %}
<section class="max-w-md mx-auto px-6 py-16">
  <div class="card p-8">
    <span class="text-xs uppercase tracking-[0.2em] text-mint-700 font-semibold">Welcome back</span>
    <h1 class="font-display text-4xl mt-1">Log in</h1>
    <p class="text-sm text-ink-700 mt-2">Patients &amp; Dr. Khan can log in below.</p>
    {% if error %}
      <div class="mt-4 p-3 rounded-xl bg-[#F5DADA] text-[#8B2E2E] text-sm" data-testid="login-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/api/login" class="mt-6 space-y-4" data-testid="login-form">
      <div><label>Email</label><input type="email" name="email" required data-testid="login-email" /></div>
      <div><label>Password</label><input type="password" name="password" required data-testid="login-password" /></div>
      <button class="btn-primary w-full" type="submit" data-testid="login-submit">Log in</button>
    </form>
    <p class="text-sm text-ink-700 mt-6 text-center">
      New here? <a href="/api/register" class="text-mint-700 font-semibold link-underline">Create an account</a>
    </p>
  </div>
</section>
{% endblock %}
