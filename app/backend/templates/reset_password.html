{% extends "base.html" %}
{% block title %}Reset Password — Smile Care Dental{% endblock %}
{% block content %}
<section class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="text-xs font-semibold text-brand-600 uppercase tracking-widest mb-2">Account recovery</div>
      <h1 class="font-display text-4xl font-bold text-ink-900">Set new password</h1>
      <p class="text-gray-500 mt-2 text-sm">Choose a strong password for your account.</p>
    </div>
    <div class="card p-8 shadow-lg">
      {% if error %}
        <div class="mb-5 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm">⚠️ {{ error }}</div>
      {% endif %}
      <form method="post" action="/api/reset-password" class="space-y-5">
        <input type="hidden" name="token" value="{{ token }}"/>
        <div>
          <label>New password</label>
          <input type="password" name="password" required minlength="6" placeholder="Min. 6 characters" autocomplete="new-password"/>
        </div>
        <div>
          <label>Confirm new password</label>
          <input type="password" name="confirm_password" required minlength="6" placeholder="Repeat password" autocomplete="new-password"/>
        </div>
        <button type="submit" class="btn btn-primary w-full py-3">Reset password →</button>
      </form>
      <div class="mt-6 pt-5 border-t text-center text-sm text-gray-500">
        <a href="/api/login" class="text-brand-600 font-semibold hover:text-brand-700">← Back to login</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
